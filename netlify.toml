# ─────────────────────────────────────────────────────────────
# Netlify config — deploys the FitSync frontend (static `client/`)
#
# The backend (Express + MongoDB + Socket.IO) CANNOT run on Netlify.
# Deploy it separately (Render / Railway / Fly.io) and point the
# frontend at it by editing client/js/config.js:
#
#   window.FITSYNC_API_ORIGIN = "https://your-api.onrender.com";
#
# ─────────────────────────────────────────────────────────────

[build]
  # No build step — the frontend is plain HTML/CSS/JS.
  publish = "client"
  command = "echo 'No build needed — static site'"

# Optional: proxy REST calls through Netlify so the browser sees a
# same-origin /api and you don't need CORS. Uncomment and set your API URL.
# (Socket.IO still connects directly to the API origin — set that in config.js.)
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-api.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA-style fallback: unknown deep links resolve to the landing page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
