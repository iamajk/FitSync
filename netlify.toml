# ─────────────────────────────────────────────────────────────
# Netlify config — deploys the FitSync frontend (static `client/`)
#
# The backend (Express + MongoDB + Socket.IO) CANNOT run on Netlify.
# Deploy it separately (Render / Railway / Fly.io) and point the
# frontend at it by editing client/js/config.js:
#
#   window.FITSYNC_API_ORIGIN = "https://your-api.onrender.com";
#
# Until that's set, every /api call fails — the app needs the backend.
# ─────────────────────────────────────────────────────────────

[build]
  # No build step — the frontend is plain HTML/CSS/JS.
  publish = "client"
  command = "echo 'No build needed — static site'"

# ── Option: proxy REST through Netlify instead of editing config.js ──
# Uncomment, set your API URL, and leave client/js/config.js untouched.
# The browser then calls a same-origin /api and CORS is not involved.
# (Socket.IO real-time won't proxy this way — set socketOrigin in
#  config.js if you want live updates, or leave it off.)
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-api.onrender.com/api/:splat"
#   status = 200
#   force = true

# NOTE: no catch-all SPA redirect. This is a multi-page site — every real
# route is a real .html file, and Netlify already serves extensionless
# URLs (/pages/login -> /pages/login.html). A greedy /* -> /index.html
# rule would swallow /api/* requests and hide backend misconfiguration.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
